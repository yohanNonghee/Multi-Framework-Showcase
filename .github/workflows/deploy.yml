name: Deploy Multi-Framework Showcase

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. Build Main Hub
      - name: Build Main Hub
        run: |
          cd main-showcase
          npm ci
          npm run build

      # 2. Build React Sub-page 
      - name: Build React Page
        run: |
          cd page-react
          npm ci
          npm run build

      # 3. Build Vue Sub-page 
      - name: Build Vue Page
        run: |
          cd page-vue
          npm ci
          npm run build

      # 4. dist  Main Hub
      - name: Combine Artifacts
        run: |
          mkdir -p main-showcase/dist/react main-showcase/dist/vue
          cp -r page-react/dist/* main-showcase/dist/react/
          cp -r page-vue/dist/* main-showcase/dist/vue/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './main-showcase/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4